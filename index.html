<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <h1>Hello world!</h1>
    <canvas width=300 height=300>My Canvas</canvas>
    <script>
      const canvas = document.currentScript.previousElementSibling;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "rgb(255, 245, 240)";
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.fillStyle = "rgb(50, 20, 20)";
      ctx.beginPath();
      ctx.arc(canvas.clientWidth * 0.5, canvas.clientHeight * 0.5, canvas.clientWidth * 0.3, 0, Math.PI * 2);
      ctx.fill();
    </script>
  </body>
</html>
